<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<style>
  @media print {
    @page {
      size: A4 landscape; /* Ρύθμιση για εκτύπωση στη μεγάλη διάσταση του Α4 */
      margin: 8mm;
    }
  }

  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 10px;
  }

  /* Πλάτος 280mm για πλήρη αξιοποίηση της μεγάλης πλευράς του A4 (297mm) */
  .table-container {
    width: 280mm;
    max-width: 100%;
    margin: 0 auto;
    box-sizing: border-box;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    text-align: center;
    table-layout: fixed; /* Κατανέμει ισόποσα το πλάτος στις στήλες */
  }

  th, td {
    border: 1px solid #c00000;
    padding: 4px 0;
    height: 32px; /* Άνετο ύψος για εύκολη χειρόγραφη συμπλήρωση */
    box-sizing: border-box;
  }

  .row-label {
    width: 115px; /* Αρκετός χώρος για να μην κόβονται οι λέξεις */
    text-align: left;
    font-weight: bold;
    padding-left: 8px;
    white-space: nowrap;
  }

  .col-sub {
    width: 25px;
  }

  .col-code {
    width: 30px;
  }

  .bold {
    font-weight: bold;
  }

  .blue-text {
    color: #002060;
  }

  .border-double-bottom {
    border-bottom: 2px solid #c00000;
  }
</style>
</head>
<body>
