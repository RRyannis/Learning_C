<!-- exam question 119 -->
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Πίνακας Αριθμών</title>
</head>
<body>

<script>
    let counter = 1;
    let html = "<table border='1' cellpadding='4' style='margin: 0 auto; text-align: center;'>";

    for (let i = 0; i < 7; i++) {
        html += "<tr>";
        for (let j = 0; j < 6; j++) {
            if (counter % 7 === 0) {
                html += `<td><b style="color: red;">${counter}</b></td>`;
            } else {
                html += `<td>${counter}</td>`;
            }
            counter++;
        }
        html += "</tr>";
    }

    html += "</table>";
    document.write(html);
</script>

</body>
</html>
